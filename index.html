<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>複数プレイリストUI（右に動画）</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  margin: 0;
  display: flex;
  height: 100vh;
  background: #f7f7f9;
  color: #222;
}

/* =========================================================
   左サイドバー
========================================================= */

#sidebar {
  width: 380px;
  overflow-y: auto;
  border-right: 1px solid #ddd;
  padding: 10px;
  background: #fff;
}

.playlist {
  margin-bottom: 20px;
}

.playlist-title {
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
  padding: 8px 10px;
  background: #eee;
  border-radius: 6px;
  user-select: none;
}

.playlist-title:hover {
  background: #e2e2e2;
}

.videos {
  display: none;
  margin-left: 4px;
  margin-top: 8px;
}

.video {
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 8px;
}

.video:hover {
  background: #f0f0f5;
}

.video .thumb-wrap {
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
}

.video img {
  width: 130px;
  height: 73px;
  object-fit: cover;
  border-radius: 6px;
  display: block;
  background: #ccc;
}

.video .title {
  font-size: 11px;
  line-height: 1.3;
  margin-top: 4px;
  max-width: 130px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: #444;
}

.video .meta {
  font-size: 9px;
  line-height: 1.3;
  margin-top: 3px;
  max-width: 130px;
  color: #888;
}

.video .tag {
  font-size: 9px;
  line-height: 1.3;
  margin-top: 3px;
  max-width: 130px;
  color: #555;
  font-weight: 600;
}

.video .right {
  flex: 1;
  display: flex;
  justify-content: center;
}

.play-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #ccc;
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: #333;
  flex-shrink: 0;
}

.play-btn:hover {
  background: #333;
  color: #fff;
  border-color: #333;
}

.video.playing .play-btn {
  background: #333;
  color: #fff;
  border-color: #333;
}

.video.playing img {
  outline: 2px solid #333;
  outline-offset: 2px;
}

/* =========================================================
   サムネイル非表示
========================================================= */

#sidebar.thumbs-hidden .video img {
  display: none;
}

#sidebar.thumbs-hidden .video .thumb-wrap {
  width: 130px;
  min-height: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#sidebar.thumbs-hidden .video .title {
  text-align: center;
}

#sidebar.thumbs-hidden .video .meta,
#sidebar.thumbs-hidden .video .tag {
  text-align: center;
}

/* =========================================================
   サイドバー操作
========================================================= */

#sidebar-controls {
  position: sticky;
  top: 0;
  background: #fff;
  padding: 4px 0 10px;
  z-index: 10;
}

#thumbBtn {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
}

#thumbBtn:hover {
  background: #f0f0f0;
}

#thumbBtn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

.loading-note {
  font-size: 11px;
  color: #999;
  padding: 4px 10px;
}

.status-note {
  font-size: 10px;
  line-height: 1.4;
  color: #888;
  padding: 4px 10px;
}

/* =========================================================
   右側プレイヤー
========================================================= */

#player-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px;
}

#controls {
  position: absolute;
  top: 16px;
  right: 20px;
  z-index: 20;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

#hideBtn,
#speedBtn {
  padding: 8px 14px;
  font-size: 13px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
}

#hideBtn:hover,
#speedBtn:hover {
  background: #f0f0f0;
}

#hideBtn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

/* =========================================================
   倍速
========================================================= */

#speed-wrap {
  position: relative;
}

#speed-menu {
  position: absolute;
  top: 42px;
  right: 0;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  padding: 8px;
  display: none;
  z-index: 21;
  min-width: 120px;
}

#speed-menu button {
  display: block;
  width: 100%;
  border: none;
  background: transparent;
  text-align: left;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 6px;
  font-size: 13px;
}

#speed-menu button:hover {
  background: #f0f0f0;
}

#speed-menu button.active {
  background: #333;
  color: #fff;
}

/* =========================================================
   プレイヤー
========================================================= */

#player-wrap {
  width: 80%;
  height: 80%;
  position: relative;
  background: #000;
  overflow: hidden;
  border-radius: 10px;
}

#player {
  width: 100%;
  height: 100%;
  position: relative;
}

#player iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* =========================================================
   動画非表示
========================================================= */

.video-mask {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: none;
  z-index: 5;
  pointer-events: none;
}

#player-area.video-hidden .video-mask {
  display: block;
}

.hidden-label {
  position: absolute;
  left: 0;
  right: 0;
  top: 40%;
  text-align: center;
  color: rgba(255,255,255,0.55);
  font-size: 13px;
  z-index: 6;
  display: none;
  pointer-events: none;
}

#player-area.video-hidden .hidden-label {
  display: block;
}

/* =========================================================
   非表示時コントロール
========================================================= */

#custom-controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 7;
  display: none;
  flex-direction: column;
  gap: 6px;
  padding: 10px 14px 12px;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.85),
    rgba(0,0,0,0)
  );
}

#player-area.video-hidden #custom-controls {
  display: flex;
}

#custom-controls .row {
  display: flex;
  align-items: center;
  gap: 10px;
}

#ccPlayBtn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.1);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#ccPlayBtn:hover {
  background: rgba(255,255,255,0.25);
}

#ccSeek {
  flex: 1;
  accent-color: #fff;
  cursor: pointer;
}

#ccTime {
  color: rgba(255,255,255,0.85);
  font-size: 11px;
  min-width: 92px;
  text-align: right;
  flex-shrink: 0;
}

#ccVol {
  width: 70px;
  accent-color: #fff;
  cursor: pointer;
}

#ccVolIcon {
  color: rgba(255,255,255,0.85);
  font-size: 13px;
  flex-shrink: 0;
  cursor: pointer;
}

/* =========================================================
   ホラー淫夢取得状況
========================================================= */

#horror-status {
  font-size: 10px;
  color: #888;
  padding: 4px 10px;
  line-height: 1.5;
}

/* =========================================================
   JavaScript
========================================================= */
</style>
</head>

<body>

<div id="player-area">

<!-- =======================================================
     YouTube IFrame API
======================================================= -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================================
   API設定
========================================================= */

const API_KEY =
  "AIzaSyAxk1YpQSe-qDtFUSUmnjnduanag41Mlyk";


/* =========================================================
   通常プレイリスト
========================================================= */

const playlists = [

  {
    id:
      "PLExT6MVBKs2Aom0n7cffel048WEWcDIJR",

    elementId:
      "list1"

  },

  {
    id:
      "PLExT6MVBKs2C60Ka3OYv1YX9ZpV5hExFV",

    elementId:
      "list2"

  }

];


/* =========================================================
   asmrmayona
========================================================= */

const CHANNEL_HANDLE =
  "asmrmayona";


/* =========================================================
   ホラー淫夢：タイトル検索語
========================================================= */

/*
 * ここは「タグ」そのものではなく、
 * YouTube検索に使う検索語。
 *
 * それぞれ完全に独立して検索する。
 */

const FILTER_KEYWORDS = [

  "【ホラー淫夢】",

  "ホラー淫夢",

  "ショートホラー淫夢",

  "短編ホラーINM",

  "社会派ホラー淫夢",

  "禍淫夢"

];


/* =========================================================
   ホラー淫夢：取得対象チャンネル
========================================================= */

/*
 * これはタグではない。
 *
 * 「このチャンネルの動画を取得する」
 * ための取得元。
 */

const KNOWN_CHANNELS = [

  "醜女ちゃんネル",

  "おんちゃ"

];


/* =========================================================
   YouTube検索の並び順
========================================================= */

const SEARCH_ORDERS = [

  "relevance",

  "viewCount",

  "date"

];


/* =========================================================
   検索ページ数
========================================================= */

/*
 * search.list は1回100ユニット。
 *
 * 3並び順 × 4ページ × 6キーワード
 * = 最大72回
 * = 最大7200ユニット。
 *
 * APIクォータを考慮して4ページに設定。
 */

const MAX_SEARCH_PAGES = 4;


/* =========================================================
   チャンネル検索結果数
========================================================= */

const CHANNEL_RESOLVE_RESULTS = 10;


/* =========================================================
   状態
========================================================= */

let currentVideoId =
  null;

let isHidden =
  false;

let player =
  null;

let ytReady =
  false;

let selectedSpeed =
  1;

let progressTimer =
  null;

let isSeeking =
  false;


/* =========================================================
   ホラー動画の重複防止
========================================================= */

const horrorVideoIds =
  new Set();


/* =========================================================
   ホラー動画の一時保存
========================================================= */

const horrorVideos =
  new Map();


/* =========================================================
   ステータス表示
========================================================= */

function setHorrorStatus(
  text
) {

  const el =
    document.getElementById(
      "horror-status"
    );


  if (el) {

    el.textContent =
      text;

  }

}


/* =========================================================
   JSON取得
========================================================= */

async function fetchJson(
  url
) {

  const response =
    await fetch(
      url
    );


  let data;


  try {

    data =
      await response.json();

  } catch (e) {

    throw new Error(
      `JSON解析失敗 HTTP ${response.status}`
    );

  }


  if (!response.ok) {

    throw new Error(
      data?.error?.message ||
      `HTTP ${response.status}`
    );

  }


  if (data?.error) {

    throw new Error(
      data.error.message ||
      "YouTube API error"
    );

  }


  return data;

}


/* =========================================================
   YouTube IFrame API
========================================================= */

function onYouTubeIframeAPIReady() {

  ytReady =
    true;


  player =
    new YT.Player(
      "player",
      {

        width:
          "100%",

        height:
          "100%",

        videoId:
          "",

        playerVars:
          {

            autoplay:
              0,

            controls:
              1,

            rel:
              0,

            modestbranding:
              1,

            playsinline:
              1

          },

        events:
          {

            onReady:
              () => {

                try {

                  player.setPlaybackRate(
                    selectedSpeed
                  );

                } catch (e) {}

              },

            onStateChange:
              onPlayerStateChange

          }

      }
    );

}


/* =========================================================
   プレイヤー状態
========================================================= */

function onPlayerStateChange(
  e
) {

  const playing =
    e.data ===
    YT.PlayerState.PLAYING;


  const btn =
    document.getElementById(
      "ccPlayBtn"
    );


  if (btn) {

    btn.textContent =
      playing
        ? "❚❚"
        : "▶";

  }

}


/* =========================================================
   プレイリスト読み込み
========================================================= */

async function loadPlaylist(
  playlistId,
  elementId
) {

  const container =
    document.getElementById(
      elementId
    );


  let items =
    [];

  let pageToken =
    "";


  try {

    do {

      const url =

        "https://www.googleapis.com/youtube/v3/playlistItems" +

        "?part=snippet" +

        "&maxResults=50" +

        `&playlistId=${encodeURIComponent(playlistId)}` +

        `&key=${encodeURIComponent(API_KEY)}` +

        (
          pageToken
            ? `&pageToken=${encodeURIComponent(pageToken)}`
            : ""
        );


      const data =
        await fetchJson(
          url
        );


      if (
        !data.items
      ) {

        break;

      }


      items =
        items.concat(
          data.items
        );


      pageToken =
        data.nextPageToken ||
        "";


    } while (
      pageToken
    );


  } catch (err) {

    console.error(
      "プレイリスト読み込み失敗:",
      err
    );

  }


  items.forEach(
    item => {

      renderVideo(
        item,
        container
      );

    }
  );


  return items;

}


/* =========================================================
   チャンネルhandleから取得
========================================================= */

async function loadChannelByHandle(
  handle,
  elementId
) {

  const note =
    document.getElementById(
      elementId + "-note"
    );


  try {

    const url =

      "https://www.googleapis.com/youtube/v3/channels" +

      "?part=contentDetails" +

      `&forHandle=${encodeURIComponent(handle)}` +

      `&key=${encodeURIComponent(API_KEY)}`;


    const data =
      await fetchJson(
        url
      );


    const uploadsId =

      data.items?.[0]
        ?.contentDetails
        ?.relatedPlaylists
        ?.uploads;


    if (!uploadsId) {

      if (note) {

        note.textContent =
          "チャンネルが見つかりませんでした";

      }

      return;

    }


    await loadPlaylist(
      uploadsId,
      elementId
    );


    if (note) {

      note.remove();

    }


  } catch (err) {

    console.error(
      "チャンネル読み込み失敗:",
      err
    );


    if (note) {

      note.textContent =
        `読み込みに失敗しました: ${err.message}`;

    }

  }

}


/* =========================================================
   動画詳細取得
========================================================= */

async function fetchVideoDetailsMap(
  videoIds
) {

  const map =
    new Map();


  for (
    let i = 0;
    i < videoIds.length;
    i += 50
  ) {

    const chunk =
      videoIds.slice(
        i,
        i + 50
      );


    if (
      chunk.length === 0
    ) {

      continue;

    }


    try {

      const url =

        "https://www.googleapis.com/youtube/v3/videos" +

        "?part=snippet" +

        `&id=${chunk.join(",")}` +

        `&key=${encodeURIComponent(API_KEY)}`;


      const data =
        await fetchJson(
          url
        );


      if (
        !data.items
      ) {

        continue;

      }


      data.items.forEach(
        video => {

          map.set(
            video.id,
            {

              title:
                video.snippet?.title ||
                "",

              thumb:

                video.snippet?.thumbnails?.medium?.url ||

                video.snippet?.thumbnails?.high?.url ||

                video.snippet?.thumbnails?.default?.url ||

                "",

              channelTitle:
                video.snippet?.channelTitle ||
                ""

            }
          );

        }
      );


    } catch (err) {

      console.error(
        "動画詳細取得失敗:",
        err
      );

    }

  }


  return map;

}


/* =========================================================
   検索候補取得
========================================================= */

async function searchCandidates(
  query
) {

  const candidateIds =
    new Set();


  for (
    const order of SEARCH_ORDERS
  ) {

    let pageToken =
      "";

    let page =
      0;


    try {

      do {

        page++;


        const url =

          "https://www.googleapis.com/youtube/v3/search" +

          "?part=snippet" +

          "&maxResults=50" +

          "&type=video" +

          `&order=${encodeURIComponent(order)}` +

          `&q=${encodeURIComponent(query)}` +

          `&key=${encodeURIComponent(API_KEY)}` +

          (
            pageToken
              ? `&pageToken=${encodeURIComponent(pageToken)}`
              : ""
          );


        const data =
          await fetchJson(
            url
          );


        if (
          !data.items
        ) {

          break;

        }


        data.items.forEach(
          item => {

            const videoId =
              item.id?.videoId;


            if (videoId) {

              candidateIds.add(
                videoId
              );

            }

          }
        );


        pageToken =
          data.nextPageToken ||
          "";


        if (
          page >=
          MAX_SEARCH_PAGES
        ) {

          break;

        }


      } while (
        pageToken
      );


    } catch (err) {

      console.error(
        `検索失敗: ${query} / ${order}`,
        err
      );

    }

  }


  return candidateIds;

}


/* =========================================================
   チャンネル名 → チャンネルID
========================================================= */

async function resolveChannelIdByName(
  nameQuery
) {

  try {

    const url =

      "https://www.googleapis.com/youtube/v3/search" +

      "?part=snippet" +

      "&type=channel" +

      `&maxResults=${CHANNEL_RESOLVE_RESULTS}` +

      `&q=${encodeURIComponent(nameQuery)}` +

      `&key=${encodeURIComponent(API_KEY)}`;


    const data =
      await fetchJson(
        url
      );


    const items =
      data.items ||
      [];


    if (
      items.length === 0
    ) {

      return null;

    }


    /*
     * ① チャンネル名完全一致
     */

    const exact =
      items.find(
        item =>
          item.snippet?.channelTitle ===
          nameQuery
      );


    if (exact) {

      return (
        exact.id?.channelId ||
        null
      );

    }


    /*
     * ② チャンネル名部分一致
     */

    const partial =
      items.find(
        item =>
          (
            item.snippet?.channelTitle ||
            ""
          ).includes(
            nameQuery
          )
      );


    if (partial) {

      return (
        partial.id?.channelId ||
        null
      );

    }


    /*
     * ③ 最後に1位
     */

    return (
      items[0]?.id?.channelId ||
      null
    );


  } catch (err) {

    console.error(
      `チャンネル検索失敗: ${nameQuery}`,
      err
    );


    return null;

  }

}


/* =========================================================
   チャンネルのアップロード動画取得
========================================================= */

async function fetchChannelUploadsMap(
  channelId
) {

  const map =
    new Map();


  try {

    const channelUrl =

      "https://www.googleapis.com/youtube/v3/channels" +

      "?part=contentDetails" +

      `&id=${encodeURIComponent(channelId)}` +

      `&key=${encodeURIComponent(API_KEY)}`;


    const channelData =
      await fetchJson(
        channelUrl
      );


    const uploadsId =

      channelData.items?.[0]
        ?.contentDetails
        ?.relatedPlaylists
        ?.uploads;


    if (!uploadsId) {

      return map;

    }


    let pageToken =
      "";


    do {

      const url =

        "https://www.googleapis.com/youtube/v3/playlistItems" +

        "?part=snippet" +

        "&maxResults=50" +

        `&playlistId=${encodeURIComponent(uploadsId)}` +

        `&key=${encodeURIComponent(API_KEY)}` +

        (
          pageToken
            ? `&pageToken=${encodeURIComponent(pageToken)}`
            : ""
        );


      const data =
        await fetchJson(
          url
        );


      if (
        !data.items
      ) {

        break;

      }


      data.items.forEach(
        item => {

          const videoId =
            item.snippet
              ?.resourceId
              ?.videoId;


          if (!videoId) {

            return;

          }


          const thumb =

            item.snippet?.thumbnails?.medium?.url ||

            item.snippet?.thumbnails?.high?.url ||

            item.snippet?.thumbnails?.default?.url ||

            "";


          map.set(
            videoId,
            {

              title:
                item.snippet?.title ||
                "",

              thumb,

              channelTitle:
                item.snippet?.channelTitle ||
                ""

            }
          );

        }
      );


      pageToken =
        data.nextPageToken ||
        "";


    } while (
      pageToken
    );


  } catch (err) {

    console.error(
      "チャンネル動画取得失敗:",
      err
    );

  }


  return map;

}


/* =========================================================
   ★タイトルからタグを取得
========================================================= */

/*
 * ここが今回の最重要部分。
 *
 * 「検索キーワード」ではタグを決めない。
 *
 * 実際の動画タイトルだけを見て決める。
 *
 * また、包含関係があるため、
 * 長い・特殊なタグから先に判定する。
 */

function getTitleTag(
  title
) {

  const t =
    title || "";


  /*
   * ① 【ホラー淫夢】
   *
   * 「ホラー淫夢」とは別物。
   */

  if (
    t.includes(
      "【ホラー淫夢】"
    )
  ) {

    return "【ホラー淫夢】";

  }


  /*
   * ② ショートホラー淫夢
   *
   * 通常の「ホラー淫夢」に吸収しない。
   */

  if (
    t.includes(
      "ショートホラー淫夢"
    )
  ) {

    return "ショートホラー淫夢";

  }


  /*
   * ③ 社会派ホラー淫夢
   */

  if (
    t.includes(
      "社会派ホラー淫夢"
    )
  ) {

    return "社会派ホラー淫夢";

  }


  /*
   * ④ 短編ホラーINM
   */

  if (
    t.includes(
      "短編ホラーINM"
    )
  ) {

    return "短編ホラーINM";

  }


  /*
   * ⑤ 禍淫夢
   */

  if (
    t.includes(
      "禍淫夢"
    )
  ) {

    return "禍淫夢";

  }


  /*
   * ⑥ 通常のホラー淫夢
   *
   * 上の特殊タグを全部先に処理したので、
   * 【ホラー淫夢】などがここへ来ることはない。
   */

  if (
    t.includes(
      "ホラー淫夢"
    )
  ) {

    return "ホラー淫夢";

  }


  return "";

}


/* =========================================================
   タイトルに対象タグがあるか
========================================================= */

function hasHorrorTag(
  title
) {

  return (
    getTitleTag(
      title
    ) !== ""
  );

}


/* =========================================================
   ホラー動画を追加
========================================================= */

function addHorrorVideo(
  videoId,
  info,
  source,
  sourceType
) {

  if (!videoId) {

    return;

  }


  /*
   * タイトルからタグを取得。
   */

  const tag =
    getTitleTag(
      info.title
    );


  /*
   * 検索結果の場合、
   * タイトルに対象タグがなければ入れない。
   *
   * チャンネル取得の場合は、
   * 「取得できた動画を捨てない」。
   */

  if (
    sourceType === "search" &&
    !tag
  ) {

    return;

  }


  /*
   * 同じ動画が検索とチャンネルの両方に
   * 登場しても1件だけ。
   */

  if (
    horrorVideos.has(
      videoId
    )
  ) {

    /*
     * 既存データにタグを追加。
     */

    const existing =
      horrorVideos.get(
        videoId
      );


    const actualTag =
      getTitleTag(
        existing.title
      );


    existing.tag =
      actualTag ||
      existing.tag ||
      "タグなし";


    return;

  }


  horrorVideos.set(
    videoId,
    {

      videoId,

      title:
        info.title ||
        "",

      thumb:
        info.thumb ||
        "",

      channelTitle:
        info.channelTitle ||
        "",

      tag:
        tag ||
        "タグなし",

      source:
        source ||
        info.channelTitle ||
        "不明",

      sourceType:
        sourceType ||
        "unknown"

    }
  );

}


/* =========================================================
   ★ホラー淫夢シリーズ全体取得
========================================================= */

async function loadHorrorInmContent() {

  const container =
    document.getElementById(
      "list4"
    );


  /*
   * 念のため初期化。
   */

  horrorVideos.clear();

  horrorVideoIds.clear();


  /*
   * 画面を空にする。
   */

  container.innerHTML =
    "";


  /* =====================================================
     STEP 1
     醜女ちゃんネル
     おんちゃ
     の動画を丸ごと取得
  ===================================================== */

  for (
    const channelName of KNOWN_CHANNELS
  ) {

    setHorrorStatus(
      `「${channelName}」を検索中...`
    );


    const channelId =
      await resolveChannelIdByName(
        channelName
      );


    if (!channelId) {

      console.warn(
        `チャンネルが見つかりません: ${channelName}`
      );


      setHorrorStatus(
        `「${channelName}」が見つからないため次へ`
      );


      continue;

    }


    setHorrorStatus(
      `「${channelName}」の動画を取得中...`
    );


    const uploads =
      await fetchChannelUploadsMap(
        channelId
      );


    /*
     * ★ここではタイトルで捨てない。
     *
     * 取得した動画を全部登録する。
     *
     * これが以前との大きな違い。
     */

    uploads.forEach(
      (
        info,
        videoId
      ) => {

        addHorrorVideo(

          videoId,

          info,

          channelName,

          "channel"

        );

      }
    );


    setHorrorStatus(
      `「${channelName}」から ${uploads.size}件取得`
    );

  }


  /* =====================================================
     STEP 2
     タイトルキーワード検索
  ===================================================== */

  for (
    const keyword of FILTER_KEYWORDS
  ) {

    setHorrorStatus(
      `「${keyword}」を検索中... 現在 ${horrorVideos.size}件`
    );


    const candidateIds =
      await searchCandidates(
        keyword
      );


    setHorrorStatus(
      `「${keyword}」候補 ${candidateIds.size}件を確認中...`
    );


    /*
     * 候補IDからタイトルを取得。
     */

    const details =
      await fetchVideoDetailsMap(
        [...candidateIds]
      );


    let matched =
      0;


    details.forEach(
      (
        info,
        videoId
      ) => {

        /*
         * ★検索語ではなく、
         * 実際のタイトルからタグ判定。
         */

        const tag =
          getTitleTag(
            info.title
          );


        if (!tag) {

          return;

        }


        matched++;


        addHorrorVideo(

          videoId,

          info,

          info.channelTitle,

          "search"

        );

      }
    );


    console.log(
      `[ホラー淫夢] ${keyword}`,
      {
        candidate:
          candidateIds.size,

        details:
          details.size,

        matched,

        total:
          horrorVideos.size

      }
    );

  }


  /* =====================================================
     STEP 3
     表示
  ===================================================== */

  let count =
    0;


  horrorVideos.forEach(
    video => {

      renderHorrorVideo(
        video,
        container
      );


      count++;

    }
  );


  /* =====================================================
     結果表示
  ===================================================== */

  if (
    count === 0
  ) {

    setHorrorStatus(
      "動画を取得できませんでした。F12のConsoleに詳細を表示しています。"
    );


  } else {

    setHorrorStatus(
      `${count}件取得`
    );

  }


  console.log(
    "========================================"
  );

  console.log(
    "ホラー淫夢シリーズ 最終取得結果"
  );

  console.log(
    "動画数:",
    count
  );

  console.log(
    "取得元:",
    KNOWN_CHANNELS
  );

  console.log(
    "検索語:",
    FILTER_KEYWORDS
  );

  console.log(
    "動画一覧:",
    [...horrorVideos.values()]
  );

  console.log(
    "========================================"
  );

}


/* =========================================================
   ホラー動画表示
========================================================= */

function renderHorrorVideo(
  video,
  container
) {

  if (
    horrorVideoIds.has(
      video.videoId
    )
  ) {

    return;

  }


  horrorVideoIds.add(
    video.videoId
  );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "video";


  div.dataset.videoId =
    video.videoId;


  /* =====================================================
     サムネイル
  ===================================================== */

  const thumbWrap =
    document.createElement(
      "div"
    );


  thumbWrap.className =
    "thumb-wrap";


  const img =
    document.createElement(
      "img"
    );


  img.src =
    video.thumb ||
    `https://i.ytimg.com/vi/${video.videoId}/mqdefault.jpg`;


  img.alt =
    video.title;


  img.loading =
    "lazy";


  /* =====================================================
     タイトル
  ===================================================== */

  const titleEl =
    document.createElement(
      "div"
    );


  titleEl.className =
    "title";


  titleEl.textContent =
    video.title;


  /* =====================================================
     タグ
  ===================================================== */

  const tagEl =
    document.createElement(
      "div"
    );


  tagEl.className =
    "tag";


  tagEl.textContent =
    `タグ：${video.tag}`;


  /* =====================================================
     取得元
  ===================================================== */

  const metaEl =
    document.createElement(
      "div"
    );


  metaEl.className =
    "meta";


  metaEl.textContent =
    `取得元：${video.source}`;


  thumbWrap.appendChild(
    img
  );


  thumbWrap.appendChild(
    titleEl
  );


  thumbWrap.appendChild(
    tagEl
  );


  thumbWrap.appendChild(
    metaEl
  );


  thumbWrap.onclick =
    () =>
      play(
        video.videoId,
        div
      );


  /* =====================================================
     再生ボタン
  ===================================================== */

  const right =
    document.createElement(
      "div"
    );


  right.className =
    "right";


  const playBtn =
    document.createElement(
      "button"
    );


  playBtn.className =
    "play-btn";


  playBtn.textContent =
    "▶";


  playBtn.title =
    "再生";


  playBtn.onclick =
    () =>
      play(
        video.videoId,
        div
      );


  right.appendChild(
    playBtn
  );


  div.appendChild(
    thumbWrap
  );


  div.appendChild(
    right
  );


  container.appendChild(
    div
  );

}

/* =========================================================
   開閉
========================================================= */

function toggle(
  id
) {

  const el =
    document.getElementById(
      id
    );


  if (!el) {

    return;

  }


  el.style.display =
    el.style.display ===
      "block"

      ? "none"

      : "block";

}


/* =========================================================
   再生
========================================================= */

function play(
  id,
  el
) {

  currentVideoId =
    id;


  document
    .querySelectorAll(
      ".video.playing"
    )
    .forEach(
      v =>
        v.classList.remove(
          "playing"
        )
    );


  if (el) {

    el.classList.add(
      "playing"
    );

  }


  if (
    player &&
    ytReady
  ) {

    try {

      player.loadVideoById(
        id
      );


      player.setPlaybackRate(
        selectedSpeed
      );


    } catch (e) {

      console.error(
        "動画再生エラー:",
        e
      );

    }

  }


  updatePlayerState();

}


/* =========================================================
   プレイヤー状態
========================================================= */

function updatePlayerState() {

  const area =
    document.getElementById(
      "player-area"
    );


  if (!currentVideoId) {

    area.classList.remove(
      "video-hidden"
    );


    stopProgressTracking();


    return;

  }


  if (isHidden) {

    area.classList.add(
      "video-hidden"
    );


    startProgressTracking();


  } else {

    area.classList.remove(
      "video-hidden"
    );


    stopProgressTracking();

  }

}

    .querySelectorAll(
      "button"

/* =========================================================
   時間表示
========================================================= */

function formatTime(
  sec
) {

  if (
    !isFinite(sec) ||
    sec < 0
  ) {

    sec =
      0;

  }


  const m =
    Math.floor(
      sec / 60
    );


  const s =
    Math.floor(
      sec % 60
    );


  return (

    `${m}:` +

    s
      .toString()
      .padStart(
        2,
        "0"
      )

  );

}


/* =========================================================
   進捗監視
========================================================= */

function startProgressTracking() {

  stopProgressTracking();


  progressTimer =
    setInterval(
      () => {

        if (
          !player ||
          !ytReady ||
          isSeeking
        ) {

          return;

        }


        try {

          const dur =
            player.getDuration();


          const cur =
            player.getCurrentTime();


          if (
            dur > 0
          ) {

            document.getElementById(
              "ccSeek"
            ).value =

              Math.floor(
                (
                  cur /
                  dur
                ) *
                1000
              );


            document.getElementById(
              "ccTime"
            ).textContent =

              `${formatTime(cur)} / ${formatTime(dur)}`;

          }


          const state =
            player.getPlayerState();


          document.getElementById(
            "ccPlayBtn"
          ).textContent =

            state ===
            YT.PlayerState.PLAYING

              ? "❚❚"

              : "▶";


        } catch (e) {}

      },

      400

    );

}


/* =========================================================
   進捗監視停止
========================================================= */

function stopProgressTracking() {

  if (
    progressTimer
  ) {

    clearInterval(
      progressTimer
    );


    progressTimer =
      null;

  }

}


/* =========================================================
   再生 / 一時停止
========================================================= */

function ccTogglePlay() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  const state =
    player.getPlayerState();


  if (
    state ===
    YT.PlayerState.PLAYING
  ) {

    player.pauseVideo();

  } else {

    player.playVideo();

  }

}


/* =========================================================
   シーク
========================================================= */

function ccOnSeekInput() {

  isSeeking =
    true;


  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  try {

    const dur =
      player.getDuration();


    const val =
      document.getElementById(
        "ccSeek"
      ).value;


    const target =
      (
        val /
        1000
      ) *
      dur;


    document.getElementById(
      "ccTime"
    ).textContent =

      `${formatTime(target)} / ${formatTime(dur)}`;


  } catch (e) {}

}


/* =========================================================
   シーク確定
========================================================= */

function ccOnSeekCommit() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  try {

    const dur =
      player.getDuration();


    const val =
      document.getElementById(
        "ccSeek"
      ).value;


    const target =
      (
        val /
        1000
      ) *
      dur;


    player.seekTo(
      target,
      true
    );


  } catch (e) {}


  isSeeking =
    false;

}


/* =========================================================
   音量
========================================================= */

function ccOnVolInput() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  const vol =
    document.getElementById(
      "ccVol"
    ).value;


  try {

    player.setVolume(
      vol
    );


    if (
      vol > 0 &&
      player.isMuted()
    ) {

      player.unMute();

    }


    document.getElementById(
      "ccVolIcon"
    ).textContent =

      vol == 0
        ? "🔇"
        : "🔊";


  } catch (e) {}

}


/* =========================================================
   ミュート
========================================================= */

function ccToggleMute() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  try {

    if (
      player.isMuted()
    ) {

      player.unMute();


      document.getElementById(
        "ccVolIcon"
      ).textContent =
        "🔊";


    } else {

      player.mute();


      document.getElementById(
        "ccVolIcon"
      ).textContent =
        "🔇";

    }


  } catch (e) {}

}
