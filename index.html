/* =========================================================
   基本
========================================================= */

* {

}

/* =========================================================

#player {

/* =========================================================

/* =========================================================
   JSON取得
========================================================= */

async function fetchJson(
    url
) {

    const response =
        await fetch(
            url
        );


    let data;


    try {

        data =
            await response.json();

    } catch (error) {

        throw new Error(
            `JSON解析失敗 HTTP ${response.status}`
        );

    }


    if (
        !response.ok
    ) {

        throw new Error(
            data?.error?.message ||
            `HTTP ${response.status}`
        );

    }


    if (
        data?.error
    ) {

        throw new Error(
            data.error.message ||
            "YouTube API error"
        );

    }


    return data;

}

/* =========================================================
   通常プレイリスト
========================================================= */

async function loadPlaylist(
    playlistId,
    elementId
) {

    const container =
        document.getElementById(
            elementId
        );


    if (!container) {

        return;

    }


    let items =
        [];


    let pageToken =
        "";


    try {

        do {

            const url =

                "https://www.googleapis.com/youtube/v3/playlistItems" +

                "?part=snippet" +

                "&maxResults=50" +

                `&playlistId=${encodeURIComponent(playlistId)}` +

                `&key=${encodeURIComponent(API_KEY)}` +

                (
                    pageToken
                        ? `&pageToken=${encodeURIComponent(pageToken)}`
                        : ""
                );


            const data =
                await fetchJson(
                    url
                );


            if (
                !data.items
            ) {

                break;

            }


            items =
                items.concat(
                    data.items
                );


            pageToken =
                data.nextPageToken ||
                "";


        } while (
            pageToken
        );


    } catch (error) {

        console.error(
            "プレイリスト読み込み失敗:",
            error
        );

        return;

    }


    items.forEach(
        item => {

            renderVideo(
                item,
                container
            );

        }
    );

}


/* =========================================================
   handleからチャンネル取得
========================================================= */

async function loadChannelByHandle(
    handle,
    elementId
) {

    const note =
        document.getElementById(
            elementId + "-note"
        );


    try {

        const url =

            "https://www.googleapis.com/youtube/v3/channels" +

            "?part=contentDetails" +

            `&forHandle=${encodeURIComponent(handle)}` +

            `&key=${encodeURIComponent(API_KEY)}`;


        const data =
            await fetchJson(
                url
            );


        const uploadsId =

            data.items?.[0]
                ?.contentDetails
                ?.relatedPlaylists
                ?.uploads;


        if (!uploadsId) {

            if (note) {

                note.textContent =
                    "チャンネルが見つかりませんでした";

            }

            return;

        }


        await loadPlaylist(
            uploadsId,
            elementId
        );


        if (note) {

            note.remove();

        }


    } catch (error) {

        console.error(
            "チャンネル読み込み失敗:",
            error
        );


        if (note) {

            note.textContent =
                `読み込み失敗: ${error.message}`;

        }

    }

}


/* =========================================================
   動画詳細
========================================================= */

async function fetchVideoDetailsMap(
    videoIds
) {

    const map =
        new Map();


    for (
        let i = 0;

        i < videoIds.length;

        i += 50
    ) {

        const chunk =
            videoIds.slice(
                i,
                i + 50
            );


        if (
            chunk.length === 0
        ) {

            continue;

        }


        const url =

            "https://www.googleapis.com/youtube/v3/videos" +

            "?part=snippet" +

            `&id=${chunk.join(",")}` +

            `&key=${encodeURIComponent(API_KEY)}`;


        try {

            const data =
                await fetchJson(
                    url
                );


            (data.items || [])
                .forEach(
                    video => {

                        map.set(
                            video.id,
                            {

                                title:
                                    video.snippet?.title ||
                                    "",

                                thumb:

                                    video.snippet?.thumbnails?.medium?.url ||

                                    video.snippet?.thumbnails?.high?.url ||

                                    video.snippet?.thumbnails?.default?.url ||

                                    "",

                                channelTitle:
                                    video.snippet?.channelTitle ||
                                    ""

                            }
                        );

                    }
                );


        } catch (error) {

            console.error(
                "動画詳細取得失敗:",
                error
            );

        }

    }


    return map;

}


/* =========================================================
   ★タイトルからタグ判定
========================================================= */

function getTitleTag(
    title
) {

    const t =
        title || "";


    /*
     * 最優先
     *
     * 【ホラー淫夢】
     *
     * と
     *
     * ホラー淫夢
     *
     * を絶対に混同しない。
     */

    if (
        t.includes(
            "【ホラー淫夢】"
        )
    ) {

        return "【ホラー淫夢】";

    }


    /*
     * ショートホラー淫夢
     *
     * 通常のホラー淫夢より先に判定。
     */

    if (
        t.includes(
            "ショートホラー淫夢"
        )
    ) {

        return "ショートホラー淫夢";

    }


    /*
     * 短編ホラーINM
     */

    if (
        t.includes(
            "短編ホラーINM"
        )
    ) {

        return "短編ホラーINM";

    }


    /*
     * 最後に通常のホラー淫夢。
     */

    if (
        t.includes(
            "ホラー淫夢"
        )
    ) {

        return "ホラー淫夢";

    }


    return "";

}

   検索キャッシュ取得
========================================================= */

function getSearchCache() {

    try {

        const raw =
            localStorage.getItem(
                SEARCH_CACHE_KEY
            );


        if (!raw) {

            return {};

        }


        const data =
            JSON.parse(
                raw
            );


        if (
            !data ||
            typeof data !== "object"
        ) {

            return {};

        }


        return data;


    } catch (error) {

        return {};

    }

}


/* =========================================================
   検索キャッシュ保存
========================================================= */

function saveSearchCache(
    cache
) {

        localStorage.setItem(
            SEARCH_CACHE_KEY,
            JSON.stringify(

            )
        );

    } catch (error) {

        );

    }

}


/* =========================================================
   ★検索
========================================================= */

async function searchKeywordOnce(
    keyword
) {

    const cache =
        getSearchCache();


    const cached =
        cache[keyword];


    /*
     * キャッシュが新しければ
     * APIを呼ばない。
     */

    if (
        cached &&
        Array.isArray(
            cached.ids
        ) &&
        Date.now() -
            cached.time <
            SEARCH_CACHE_TTL
    ) {

        console.log(
            `[ホラー淫夢] キャッシュ使用: ${keyword}`
        );


        return new Set(
            cached.ids
        );

    }


    /*
     * ★ここが重要。
     *
     * 以前：
     *
     * relevance
     * viewCount
     * date
     *
     * × 最大4ページ
     *
     * 今回：
     *
     * relevance
     * × 1ページ
     *
     * これで検索API使用量を大幅削減。
     */

    const url =

        "https://www.googleapis.com/youtube/v3/search" +

        "?part=snippet" +

        "&maxResults=50" +

        "&type=video" +

        "&order=relevance" +

        `&q=${encodeURIComponent(keyword)}` +

        `&key=${encodeURIComponent(API_KEY)}`;


    let data;


    try {

        data =
            await fetchJson(
                url
            );


    } catch (error) {

        /*
         * クォータ超過を特別扱い。
         */

        if (
            String(
                error.message
            ).includes(
                "Quota exceeded"
            )
        ) {

            throw new Error(
                "YouTube APIの検索クォータを使い切っています。クォータ回復後に再読み込みしてください。"
            );

        }


        throw error;

    }


    const ids =
        new Set();


    (data.items || [])
        .forEach(
            item => {

                const videoId =
                    item.id?.videoId;


                if (videoId) {

                    ids.add(
                        videoId
                    );

                }

            }
        );


    /*
     * キャッシュ。
     */

    cache[keyword] = {

        time:
            Date.now(),

        ids:
            [...ids]

    };


    saveSearchCache(
        cache
    );


    return ids;

}

/* =========================================================
   チャンネル名検索
========================================================= */

async function resolveChannelIdByName(
    name
) {

    const cache =
        getChannelCache();


    /*
     * 以前取得したIDがあれば
     * search.listを使わない。
     */

    if (
        cache[name]
    ) {

        console.log(
            `[ホラー淫夢] キャッシュ済みチャンネルID: ${name}`
        );


        return cache[name];

    }


    /*
     * 初回だけ検索。
     */

    const url =

        "https://www.googleapis.com/youtube/v3/search" +

        "?part=snippet" +

        "&type=channel" +

        "&maxResults=10" +

        `&q=${encodeURIComponent(name)}` +

        `&key=${encodeURIComponent(API_KEY)}`;


    let data;


    try {

        data =
            await fetchJson(
                url
            );


    } catch (error) {

        if (
            String(
                error.message
            ).includes(
                "Quota exceeded"
            )
        ) {

            throw new Error(
                `「${name}」のチャンネルIDを初回取得できません。YouTube APIの検索クォータが回復してから一度実行してください。`
            );

        }


        throw error;

    }


    const items =
        data.items || [];


    /*
     * 完全一致を最優先。
     */

    const exact =
        items.find(
            item =>
                item.snippet?.channelTitle ===
                name
        );


    let channelId =
        exact?.id?.channelId ||
        null;


    /*
     * 完全一致がなければ部分一致。
     */

    if (!channelId) {

        const partial =
            items.find(
                item =>
                    (
                        item.snippet?.channelTitle ||
                        ""
                    ).includes(
                        name
                    )
            );


        channelId =
            partial?.id?.channelId ||
            null;

    }


    /*
     * 見つかったIDを保存。
     */

    if (channelId) {

        cache[name] =
            channelId;


        saveChannelCache(
            cache
        );

    }


    return channelId;

}


/* =========================================================
   ★チャンネル動画取得
========================================================= */

async function fetchChannelUploads(
    channelId
) {

    const map =
        new Map();


    /*
     * channels.list
     *
     * ここはsearch.listではない。
     *
     * 検索クォータ節約のため、
     * channel IDからuploads playlistを取得。
     */

    const channelUrl =

        "https://www.googleapis.com/youtube/v3/channels" +

        "?part=contentDetails" +

        `&id=${encodeURIComponent(channelId)}` +

        `&key=${encodeURIComponent(API_KEY)}`;


    const channelData =
        await fetchJson(
            channelUrl
        );


    const uploadsId =

        channelData.items?.[0]
            ?.contentDetails
            ?.relatedPlaylists
            ?.uploads;


    if (!uploadsId) {

        return map;

    }


    let pageToken =
        "";


    /*
     * チャンネル動画はページを全部取得。
     *
     * playlistItems.listなので
     * search.listではない。
     */

    do {

        const url =

            "https://www.googleapis.com/youtube/v3/playlistItems" +

            "?part=snippet" +

            "&maxResults=50" +

            `&playlistId=${encodeURIComponent(uploadsId)}` +

            `&key=${encodeURIComponent(API_KEY)}` +

            (
                pageToken
                    ? `&pageToken=${encodeURIComponent(pageToken)}`
                    : ""
            );


        const data =
            await fetchJson(
                url
            );


        (data.items || [])
            .forEach(
                item => {

                    const videoId =
                        item.snippet
                            ?.resourceId
                            ?.videoId;


                    if (!videoId) {

                        return;

                    }


                    const info = {

                        title:
                            item.snippet?.title ||
                            "",

                        thumb:

                            item.snippet?.thumbnails?.medium?.url ||

                            item.snippet?.thumbnails?.high?.url ||

                            item.snippet?.thumbnails?.default?.url ||

                            "",

                        channelTitle:
                            item.snippet?.channelTitle ||
                            ""

                    };


                    map.set(
                        videoId,
                        info
                    );

                }
            );


        pageToken =
            data.nextPageToken ||
            "";


    } while (
        pageToken
    );


    return map;

}


/* =========================================================
   ★ホラー動画登録

function addHorrorVideo(
    videoId,
    info,
    source,
    sourceType
) {

    if (!videoId) {

        return;

    }


    const title =
        info.title ||
        "";


    /*
     * ★タグは必ずタイトルから取得。
     */

    const tag =
        getTitleTag(
            title
        );


    /*
     * 検索結果については、
     * タイトルに対象タグがないものを除外。
     *
     * チャンネル取得の場合は、
     * タイトルにタグがなくても残す。
     */

    if (
        sourceType === "search" &&
        !tag
    ) {

        return;

    }


    /*
     * 重複。
     */

    if (
        horrorVideos.has(
            videoId
        )
    ) {

        return;

    }


    horrorVideos.set(
        videoId,
        {

            videoId:

                videoId,

            title:

                title,

            thumb:

                info.thumb ||
                `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`,

            channelTitle:

                info.channelTitle ||
                "",

            tag:

                tag ||
                "タグなし",

            source:

                source ||
                info.channelTitle ||
                "不明",

            sourceType:

                sourceType ||
                "unknown"

        }
    );

}


/* =========================================================
   ★ホラー淫夢取得本体
========================================================= */

async function loadHorrorInmContent() {

    const container =
        document.getElementById(
            "list4"
        );


    if (!container) {

        return;

    }


    /*
     * 初期化。
     */

    horrorVideos.clear();

    horrorVideoIds.clear();

    container.innerHTML =
        "";

    hideHorrorError();


    try {


        /* =================================================
           STEP 1
           醜女ちゃんネル / おんちゃ
        ================================================= */

        for (
            const channelName of KNOWN_CHANNELS
        ) {

            setHorrorStatus(
                `「${channelName}」を確認中...`
            );


            const channelId =
                await resolveChannelIdByName(
                    channelName
                );


            if (!channelId) {

                console.warn(
                    `チャンネルが見つかりません: ${channelName}`
                );


                continue;

            }


            setHorrorStatus(
                `「${channelName}」の動画を取得中...`
            );


            const uploads =
                await fetchChannelUploads(
                    channelId
                );


            /*
             * ★チャンネル動画は
             * タイトル一致で捨てない。
             */

            uploads.forEach(
                (
                    info,
                    videoId
                ) => {

                    addHorrorVideo(

                        videoId,

                        info,

                        channelName,

                        "channel"

                    );

                }
            );


            console.log(
                `[ホラー淫夢] ${channelName}: ${uploads.size}件`
            );

        }


        /* =================================================
           STEP 2
           タイトル検索
        ================================================= */

        for (
            const keyword of HORROR_SEARCH_KEYWORDS
        ) {

            setHorrorStatus(
                `「${keyword}」を検索中... 現在 ${horrorVideos.size}件`
            );


            /*
             * 1キーワードにつき
             * search.listは最大1回。
             */

            const ids =
                await searchKeywordOnce(
                    keyword
                );


            setHorrorStatus(
                `「${keyword}」候補 ${ids.size}件を確認中...`
            );


            /*
             * 50件ならvideos.list 1回。
             */

            const details =
                await fetchVideoDetailsMap(
                    [...ids]
                );


            let matched =
                0;


            details.forEach(
                (
                    info,
                    videoId
                ) => {

                    /*
                     * ★実際のタイトルから判定。
                     */

                    const tag =
                        getTitleTag(
                            info.title
                        );


                    if (!tag) {

                        return;

                    }


                    matched++;


                    addHorrorVideo(

                        videoId,

                        info,

                        info.channelTitle,

                        "search"

                    );

                }
            );


            console.log(
                `[ホラー淫夢] ${keyword}`,
                {

                    searchResults:
                        ids.size,

                    titleMatched:
                        matched,

                    total:
                        horrorVideos.size

                }
            );

        }


        /* =================================================
           STEP 3
           表示
        ================================================= */

        const videos =
            [...horrorVideos.values()];


        videos.forEach(
            video => {

                renderHorrorVideo(
                    video,
                    container
                );

            }
        );


        /* =================================================
           結果
        ================================================= */

        if (
            videos.length === 0
        ) {

            setHorrorStatus(
                "0件"
            );


            showHorrorError(
                "動画を取得できませんでした。F12のConsoleを確認してください。"
            );


        } else {

            setHorrorStatus(
                `${videos.length}件取得`
            );

        }


        /*
         * コンソールにも分類結果を表示。
         */

        const tagCounts =
            {};


        videos.forEach(
            video => {

                const tag =
                    video.tag;


                tagCounts[tag] =
                    (
                        tagCounts[tag] ||
                        0
                    ) + 1;

            }
        );


        console.log(
            "======================================"
        );


        console.log(
            "ホラー淫夢 最終結果"
        );


        console.log(
            "総数:",
            videos.length
        );


        console.log(
            "タグ別:",
            tagCounts
        );


        console.table(
            videos.map(
                video => ({

                    タイトル:
                        video.title,

                    タグ:
                        video.tag,

                    取得元:
                        video.source,

                    動画ID:
                        video.videoId

                })
            )
        );


        console.log(
            "======================================"
        );


    } catch (error) {

        console.error(
            "ホラー淫夢取得エラー:",
            error
        );


        setHorrorStatus(
            "取得エラー"
        );


        showHorrorError(
            error.message
        );

    }

}

) {

    document
        .querySelectorAll(
            ".video.playing"
        )
        .forEach(
            v =>
                v.classList.remove(
                    "playing"
                )
        );

    if (

            );


        } catch (error) {

/* =========================================================
   時間
========================================================= */

function formatTime(
    sec
) {

    if (
        !isFinite(sec) ||
        sec < 0
    ) {

        sec =
            0;

    }


    const minutes =
        Math.floor(
            sec / 60
        );


    const seconds =
        Math.floor(
            sec % 60
        );


    return (

        `${minutes}:` +

        seconds
            .toString()
            .padStart(
                2,
                "0"
            )

    );

}


/* =========================================================
   進捗監視
========================================================= */

function startProgressTracking() {

    stopProgressTracking();


    progressTimer =
        setInterval(
            () => {

                if (
                    !player ||
                    !ytReady ||
                    isSeeking
                ) {

                    return;

                }


                try {

                    const duration =
                        player.getDuration();


                    const current =
                        player.getCurrentTime();


                    if (
                        duration > 0
                    ) {

                        document.getElementById(
                            "ccSeek"
                        ).value =

                            Math.floor(
                                (
                                    current /
                                    duration
                                ) *
                                1000
                            );


                        document.getElementById(
                            "ccTime"
                        ).textContent =

                            `${formatTime(current)} / ${formatTime(duration)}`;

                    }


                    const state =
                        player.getPlayerState();


                    document.getElementById(
                        "ccPlayBtn"
                    ).textContent =

                        state ===
                        YT.PlayerState.PLAYING

                            ? "❚❚"

                            : "▶";


                } catch (error) {}

            },

            400
        );

}


/* =========================================================
   進捗停止
========================================================= */

function stopProgressTracking() {

    if (
        progressTimer
    ) {

        clearInterval(
            progressTimer
        );


        progressTimer =
            null;

    }

}


/* =========================================================
   再生・停止
========================================================= */

function ccTogglePlay() {

    if (
        !player ||
        !ytReady
    ) {

        return;

    }


    const state =
        player.getPlayerState();


    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

    } else {

        player.playVideo();

    }

}


/* =========================================================
   シーク
========================================================= */

function ccOnSeekInput() {

    isSeeking =
        true;


    if (
        !player ||
        !ytReady
    ) {

        return;

    }


    try {

        const duration =
            player.getDuration();


        const value =
            document.getElementById(
                "ccSeek"
            ).value;


        const target =
            (
                value /
                1000
            ) *
            duration;


        document.getElementById(
            "ccTime"
        ).textContent =

            `${formatTime(target)} / ${formatTime(duration)}`;


    } catch (error) {}

}


/* =========================================================
   シーク確定
========================================================= */

function ccOnSeekCommit() {

    if (
        !player ||
        !ytReady
    ) {

        return;

    }


    try {

        const duration =
            player.getDuration();


        const value =
            document.getElementById(
                "ccSeek"
            ).value;


        const target =
            (
                value /
                1000
            ) *
            duration;


        player.seekTo(
            target,
            true
        );


    } catch (error) {}


    isSeeking =
        false;

}


/* =========================================================
   音量
========================================================= */

function ccOnVolInput() {

    if (
        !player ||
        !ytReady
    ) {

        return;

    }


    const volume =
        document.getElementById(
            "ccVol"
        ).value;


    try {

        player.setVolume(
            volume
        );


        if (
            volume > 0 &&
            player.isMuted()
        ) {

            player.unMute();

        }


        document.getElementById(
            "ccVolIcon"
        ).textContent =

            volume == 0

                ? "🔇"

                : "🔊";


    } catch (error) {}

}


/* =========================================================
   ミュート
========================================================= */

function ccToggleMute() {

    if (
        !player ||
        !ytReady
    ) {

        return;

    }


    try {

        if (
            player.isMuted()
        ) {

            player.unMute();


            document.getElementById(
                "ccVolIcon"
            ).textContent =
                "🔊";


        } else {

            player.mute();


            document.getElementById(
                "ccVolIcon"
            ).textContent =
                "🔇";

        }


    } catch (error) {}

}

playlists.forEach(
