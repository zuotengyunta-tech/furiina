<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>複数プレイリストUI（右に動画）</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  margin: 0;
  display: flex;
  height: 100vh;
  background: #f7f7f9;
  color: #222;
}

/* =========================================================
   左サイドバー
========================================================= */

#sidebar {
  width: 380px;
  overflow-y: auto;
  border-right: 1px solid #ddd;
  padding: 10px;
  background: #fff;
}

.playlist {
  margin-bottom: 20px;
}

.playlist-title {
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
  padding: 8px 10px;
  background: #eee;
  border-radius: 6px;
  user-select: none;
}

.playlist-title:hover {
  background: #e2e2e2;
}

.videos {
  display: none;
  margin-left: 4px;
  margin-top: 8px;
}

.video {
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 8px;
}

.video:hover {
  background: #f0f0f5;
}

.video .thumb-wrap {
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
}

.video img {
  width: 130px;
  height: 73px;
  object-fit: cover;
  border-radius: 6px;
  display: block;
  background: #ccc;
}

.video .title {
  font-size: 11px;
  line-height: 1.3;
  margin-top: 4px;
  max-width: 130px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: #444;
}

.video .meta {
  font-size: 9px;
  line-height: 1.3;
  margin-top: 4px;
  max-width: 130px;
  color: #888;
}

.video .tag {
  font-size: 9px;
  line-height: 1.3;
  margin-top: 2px;
  max-width: 130px;
  color: #555;
  font-weight: 600;
}

.video .right {
  flex: 1;
  display: flex;
  justify-content: center;
}

.play-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #ccc;
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: #333;
  flex-shrink: 0;
}

.play-btn:hover {
  background: #333;
  color: #fff;
  border-color: #333;
}

.video.playing .play-btn {
  background: #333;
  color: #fff;
  border-color: #333;
}

.video.playing img {
  outline: 2px solid #333;
  outline-offset: 2px;
}

/* =========================================================
   サムネイル非表示
========================================================= */

#sidebar.thumbs-hidden .video img {
  display: none;
}

#sidebar.thumbs-hidden .thumb-wrap {
  width: 130px;
  min-height: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#sidebar.thumbs-hidden .video .title {
  text-align: center;
}

#sidebar.thumbs-hidden .video .meta,
#sidebar.thumbs-hidden .video .tag {
  text-align: center;
}

/* =========================================================
   サイドバー操作
========================================================= */

#sidebar-controls {
  position: sticky;
  top: 0;
  background: #fff;
  padding: 4px 0 10px;
  z-index: 2;
}

#thumbBtn {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
}

#thumbBtn:hover {
  background: #f0f0f0;
}

#thumbBtn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

.loading-note {
  font-size: 11px;
  color: #999;
  padding: 4px 10px;
}

.status-note {
  font-size: 10px;
  line-height: 1.4;
  color: #888;
  padding: 4px 10px;
}

/* =========================================================
   右側プレイヤー
========================================================= */

#player-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px;
}

#controls {
  position: absolute;
  top: 16px;
  right: 20px;
  z-index: 20;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

#hideBtn,
#speedBtn {
  padding: 8px 14px;
  font-size: 13px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
}

#hideBtn:hover,
#speedBtn:hover {
  background: #f0f0f0;
}

#hideBtn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

/* =========================================================
   倍速
========================================================= */

#speed-wrap {
  position: relative;
}

#speed-menu {
  position: absolute;
  top: 42px;
  right: 0;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  padding: 8px;
  display: none;
  z-index: 21;
  min-width: 120px;
}

#speed-menu button {
  display: block;
  width: 100%;
  border: none;
  background: transparent;
  text-align: left;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 6px;
  font-size: 13px;
}

#speed-menu button:hover {
  background: #f0f0f0;
}

#speed-menu button.active {
  background: #333;
  color: #fff;
}

/* =========================================================
   プレイヤー
========================================================= */

#player-wrap {
  width: 80%;
  height: 80%;
  position: relative;
  background: #000;
  overflow: hidden;
  border-radius: 10px;
}

#player {
  width: 100%;
  height: 100%;
  position: relative;
}

#player iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* =========================================================
   動画非表示
========================================================= */

.video-mask {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: none;
  z-index: 5;
  pointer-events: none;
}

#player-area.video-hidden .video-mask {
  display: block;
}

.hidden-label {
  position: absolute;
  left: 0;
  right: 0;
  top: 40%;
  text-align: center;
  color: rgba(255,255,255,0.55);
  font-size: 13px;
  z-index: 6;
  display: none;
  pointer-events: none;
}

#player-area.video-hidden .hidden-label {
  display: block;
}

/* =========================================================
   非表示時カスタムコントロール
========================================================= */

#custom-controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 7;
  display: none;
  flex-direction: column;
  gap: 6px;
  padding: 10px 14px 12px;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.85),
    rgba(0,0,0,0)
  );
}

#player-area.video-hidden #custom-controls {
  display: flex;
}

#custom-controls .row {
  display: flex;
  align-items: center;
  gap: 10px;
}

#ccPlayBtn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.1);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#ccPlayBtn:hover {
  background: rgba(255,255,255,0.25);
}

#ccSeek {
  flex: 1;
  accent-color: #fff;
  cursor: pointer;
}

#ccTime {
  color: rgba(255,255,255,0.85);
  font-size: 11px;
  min-width: 92px;
  text-align: right;
  flex-shrink: 0;
}

#ccVol {
  width: 70px;
  accent-color: #fff;
  cursor: pointer;
}

#ccVolIcon {
  color: rgba(255,255,255,0.85);
  font-size: 13px;
  flex-shrink: 0;
  cursor: pointer;
}

/* =========================================================
   =========================================================
   JavaScript
   =========================================================
========================================================= */

</style>
</head>

<!-- =======================================================
     YouTube IFrame API
======================================================= -->

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   基本設定
========================================================= */

const API_KEY =
  "AIzaSyAxk1YpQSe-qDtFUSUmnjnduanag41Mlyk";


/* =========================================================
   プレイリスト
========================================================= */

const playlists = [

  {
    id:
      "PLExT6MVBKs2Aom0n7cffel048WEWcDIJR",

    elementId:
      "list1"
  },

  {
    id:
      "PLExT6MVBKs2C60Ka3OYv1YX9ZpV5hExFV",

    elementId:
      "list2"
  }

];


/* =========================================================
   asmrmayona
========================================================= */

const CHANNEL_HANDLE =
  "asmrmayona";


/* =========================================================
   ホラー淫夢検索キーワード
========================================================= */

/*
 * 重要：
 *
 * それぞれ別々に検索する。
 *
 * 特に
 *
 * 【ホラー淫夢】
 *
 * と
 *
 * ホラー淫夢
 *
 * は別タグとして扱う。
 */

const FILTER_KEYWORDS = [

  "【ホラー淫夢】",

  "ホラー淫夢",

  "ショートホラー淫夢",

  "短編ホラーINM",

  "社会派ホラー淫夢",

  "禍淫夢"

];


/* =========================================================
   特定チャンネル
========================================================= */

/*
 * ここは「タグ」ではない。
 *
 * このチャンネルの動画を取得するための
 * 取得元として使用する。
 *
 * 取得した動画については、
 * タイトルからタグを判定する。
 */

const KNOWN_CHANNELS = [

  "醜女ちゃんネル",

  "おんちゃ"

];


/* =========================================================
   検索設定
========================================================= */

/*
 * relevance
 * viewCount
 * date
 *
 * の3種類を使って検索結果の取りこぼしを減らす。
 *
 * 1回の検索につき最大50件。
 *
 * MAX_SEARCH_PAGES = 3
 * なら1キーワード・1並び順につき最大150件。
 *
 * 6キーワード × 3並び順 × 3ページ
 * = 最大54回のsearch.list。
 *
 * YouTube APIのsearch.listは1回100ユニットなので、
 * クォータ消費には注意。
 */

const SEARCH_ORDERS = [

  "relevance",

  "viewCount",

  "date"

];


const MAX_SEARCH_PAGES = 3;


/*
 * チャンネル検索は10件程度取得して、
 * 完全一致を最優先する。
 */

const CHANNEL_RESOLVE_RESULTS = 10;


/* =========================================================
   状態
========================================================= */

let currentVideoId =
  null;

let isHidden =
  false;

let player =
  null;

let ytReady =
  false;

let selectedSpeed =
  1;

let progressTimer =
  null;

let isSeeking =
  false;


/* =========================================================
   ホラー動画重複管理
========================================================= */

const horrorVideoIds =
  new Set();


/* =========================================================
   YouTube IFrame API
========================================================= */

function onYouTubeIframeAPIReady() {

  ytReady =
    true;


  player =
    new YT.Player(
      "player",
      {

        width:
          "100%",

        height:
          "100%",

        videoId:
          "",

        playerVars:
          {

            autoplay:
              0,

            controls:
              1,

            rel:
              0,

            modestbranding:
              1,

            playsinline:
              1

          },

        events:
          {

            onReady:
              () => {

                try {

                  player.setPlaybackRate(
                    selectedSpeed
                  );

                } catch (e) {}

              },


            onStateChange:
              onPlayerStateChange

          }

      }
    );

}


/* =========================================================
   プレイヤー状態
========================================================= */

function onPlayerStateChange(e) {

  const playing =
    e.data ===
    YT.PlayerState.PLAYING;


  document.getElementById(
    "ccPlayBtn"
  ).textContent =
    playing
      ? "❚❚"
      : "▶";

}


/* =========================================================
   JSONレスポンス確認
========================================================= */

async function fetchJson(url) {

  const response =
    await fetch(url);


  let data;

  try {

    data =
      await response.json();

  } catch (e) {

    throw new Error(
      `JSON解析失敗 HTTP ${response.status}`
    );

  }


  if (!response.ok) {

    const message =
      data?.error?.message ||
      `HTTP ${response.status}`;

    throw new Error(
      message
    );

  }


  if (data?.error) {

    throw new Error(
      data.error.message ||
      "YouTube API error"
    );

  }


  return data;

}


/* =========================================================
   プレイリスト読み込み
========================================================= */

async function loadPlaylist(
  playlistId,
  elementId
) {

  const container =
    document.getElementById(
      elementId
    );


  let items =
    [];

  let pageToken =
    "";


  try {

    do {

      const url =

        `https://www.googleapis.com/youtube/v3/playlistItems` +

        `?part=snippet` +

        `&maxResults=50` +

        `&playlistId=${encodeURIComponent(playlistId)}` +

        `&key=${encodeURIComponent(API_KEY)}` +

        (
          pageToken
            ? `&pageToken=${encodeURIComponent(pageToken)}`
            : ""
        );


      const data =
        await fetchJson(url);


      if (
        !data.items
      ) {

        break;

      }


      items =
        items.concat(
          data.items
        );


      pageToken =
        data.nextPageToken ||
        "";


    } while (
      pageToken
    );


  } catch (err) {

    console.error(
      "プレイリスト読み込み失敗:",
      err
    );

  }


  items.forEach(
    item =>
      renderVideo(
        item,
        container
      )
  );


  return items;

}


/* =========================================================
   チャンネルhandleから取得
========================================================= */

async function loadChannelByHandle(
  handle,
  elementId
) {

  const note =
    document.getElementById(
      elementId + "-note"
    );


  try {

    const url =

      `https://www.googleapis.com/youtube/v3/channels` +

      `?part=contentDetails` +

      `&forHandle=${encodeURIComponent(handle)}` +

      `&key=${encodeURIComponent(API_KEY)}`;


    const data =
      await fetchJson(url);


    const uploadsId =

      data.items?.[0]
        ?.contentDetails
        ?.relatedPlaylists
        ?.uploads;


    if (!uploadsId) {

      if (note) {

        note.textContent =
          "チャンネルが見つかりませんでした";

      }

      return;

    }


    await loadPlaylist(
      uploadsId,
      elementId
    );


    if (note) {

      note.remove();

    }


  } catch (err) {

    console.error(
      "チャンネル読み込み失敗:",
      err
    );


    if (note) {

      note.textContent =
        `読み込み失敗: ${err.message}`;

    }

  }

}


/* =========================================================
   動画詳細取得
========================================================= */

async function fetchVideoDetailsMap(
  videoIds
) {

  const map =
    new Map();


  for (
    let i = 0;
    i < videoIds.length;
    i += 50
  ) {

    const chunk =
      videoIds.slice(
        i,
        i + 50
      );


    if (
      chunk.length === 0
    ) {

      continue;

    }


    try {

      const url =

        `https://www.googleapis.com/youtube/v3/videos` +

        `?part=snippet` +

        `&id=${chunk.join(",")}` +

        `&key=${encodeURIComponent(API_KEY)}`;


      const data =
        await fetchJson(url);


      if (
        !data.items
      ) {

        continue;

      }


      data.items.forEach(
        video => {

          map.set(
            video.id,
            {

              title:
                video.snippet?.title ||
                "",

              thumb:
                (
                  video.snippet?.thumbnails?.medium?.url ||

                  video.snippet?.thumbnails?.high?.url ||

                  video.snippet?.thumbnails?.default?.url ||

                  ""
                ),

              channelTitle:
                video.snippet?.channelTitle ||
                ""

            }
          );

        }
      );


    } catch (err) {

      console.error(
        "動画詳細取得失敗:",
        err
      );

    }

  }


  return map;

}


/* =========================================================
   キーワード検索
========================================================= */

/*
 * キーワードを結合しない。
 *
 * 1キーワードずつ完全に独立して検索する。
 */

async function searchCandidates(
  query
) {

  const candidateIds =
    new Set();


  for (
    const order of SEARCH_ORDERS
  ) {

    let pageToken =
      "";

    let pageCount =
      0;


    try {

      do {

        pageCount++;


        const url =

          `https://www.googleapis.com/youtube/v3/search` +

          `?part=snippet` +

          `&maxResults=50` +

          `&type=video` +

          `&order=${encodeURIComponent(order)}` +

          `&q=${encodeURIComponent(query)}` +

          `&key=${encodeURIComponent(API_KEY)}` +

          (
            pageToken
              ? `&pageToken=${encodeURIComponent(pageToken)}`
              : ""
          );


        const data =
          await fetchJson(url);


        if (
          !data.items
        ) {

          break;

        }


        data.items.forEach(
          item => {

            const videoId =
              item.id?.videoId;


            if (videoId) {

              candidateIds.add(
                videoId
              );

            }

          }
        );


        pageToken =
          data.nextPageToken ||
          "";


        /*
         * 設定ページ数を超えたら停止。
         */

        if (
          pageCount >=
          MAX_SEARCH_PAGES
        ) {

          break;

        }


      } while (
        pageToken
      );


    } catch (err) {

      console.error(

        `検索失敗: "${query}" / ${order}`,

        err

      );

    }

  }


  return candidateIds;

}


/* =========================================================
   チャンネル名からチャンネルIDを特定
========================================================= */

async function resolveChannelIdByName(
  nameQuery
) {

  try {

    const url =

      `https://www.googleapis.com/youtube/v3/search` +

      `?part=snippet` +

      `&type=channel` +

      `&maxResults=${CHANNEL_RESOLVE_RESULTS}` +

      `&q=${encodeURIComponent(nameQuery)}` +

      `&key=${encodeURIComponent(API_KEY)}`;


    const data =
      await fetchJson(url);


    if (
      !data.items ||
      data.items.length === 0
    ) {

      return null;

    }


    /*
     * まず完全一致。
     */

    const exact =
      data.items.find(
        item =>
          item.snippet?.channelTitle ===
          nameQuery
      );


    if (exact) {

      return (
        exact.id?.channelId ||
        null
      );

    }


    /*
     * 完全一致がなければ、
     * チャンネルタイトルに検索語が含まれるもの。
     */

    const partial =
      data.items.find(
        item =>
          (
            item.snippet?.channelTitle ||
            ""
          ).includes(
            nameQuery
          )
      );


    if (partial) {

      return (
        partial.id?.channelId ||
        null
      );

    }


    /*
     * 最後に検索1位。
     */

    return (
      data.items[0]?.id?.channelId ||
      null
    );


  } catch (err) {

    console.error(

      `チャンネル解決失敗: "${nameQuery}"`,

      err

    );


    return null;

  }

}


/* =========================================================
   チャンネルのアップロード全取得
========================================================= */

async function fetchChannelUploadsMap(
  channelId
) {

  const map =
    new Map();


  try {

    const channelUrl =

      `https://www.googleapis.com/youtube/v3/channels` +

      `?part=contentDetails` +

      `&id=${encodeURIComponent(channelId)}` +

      `&key=${encodeURIComponent(API_KEY)}`;


    const channelData =
      await fetchJson(
        channelUrl
      );


    const uploadsId =

      channelData.items?.[0]
        ?.contentDetails
        ?.relatedPlaylists
        ?.uploads;


    if (!uploadsId) {

      return map;

    }


    let pageToken =
      "";


    do {

      const url =

        `https://www.googleapis.com/youtube/v3/playlistItems` +

        `?part=snippet` +

        `&maxResults=50` +

        `&playlistId=${encodeURIComponent(uploadsId)}` +

        `&key=${encodeURIComponent(API_KEY)}` +

        (
          pageToken
            ? `&pageToken=${encodeURIComponent(pageToken)}`
            : ""
        );


      const data =
        await fetchJson(url);


      if (
        !data.items
      ) {

        break;

      }


      data.items.forEach(
        item => {

          const videoId =
            item.snippet
              ?.resourceId
              ?.videoId;


          if (!videoId) {

            return;

          }


          const thumb =

            item.snippet?.thumbnails?.medium?.url ||

            item.snippet?.thumbnails?.high?.url ||

            item.snippet?.thumbnails?.default?.url ||

            "";


          map.set(
            videoId,
            {

              title:
                item.snippet?.title ||
                "",

              thumb,

              channelTitle:
                item.snippet?.channelTitle ||
                ""

            }
          );

        }
      );


      pageToken =
        data.nextPageToken ||
        "";


    } while (
      pageToken
    );


  } catch (err) {

    console.error(
      "チャンネル投稿一覧取得失敗:",
      err
    );

  }


  return map;

}


/* =========================================================
   タイトルからタグ取得
========================================================= */

/*
 * ★今回の最重要部分
 *
 * タグはタイトルだけから取得する。
 *
 * 判定順序が非常に重要。
 *
 * 「【ホラー淫夢】」
 * を先に判定することで、
 *
 * 【ホラー淫夢】○○
 *
 * が
 *
 * ホラー淫夢
 *
 * にも分類されることを防止する。
 */

function getTitleTag(
  title
) {

  const t =
    title || "";


  /*
   * ① 【ホラー淫夢】
   */

  if (
    t.includes(
      "【ホラー淫夢】"
    )
  ) {

    return "【ホラー淫夢】";

  }


  /*
   * ② ショートホラー淫夢
   */

  if (
    t.includes(
      "ショートホラー淫夢"
    )
  ) {

    return "ショートホラー淫夢";

  }


  /*
   * ③ 短編ホラーINM
   */

  if (
    t.includes(
      "短編ホラーINM"
    )
  ) {

    return "短編ホラーINM";

  }


  /*
   * ④ 社会派ホラー淫夢
   */

  if (
    t.includes(
      "社会派ホラー淫夢"
    )
  ) {

    return "社会派ホラー淫夢";

  }


  /*
   * ⑤ 禍淫夢
   */

  if (
    t.includes(
      "禍淫夢"
    )
  ) {

    return "禍淫夢";

  }


  /*
   * ⑥ 通常のホラー淫夢
   *
   * 【ホラー淫夢】は既に上で処理済み。
   */

  if (
    t.includes(
      "ホラー淫夢"
    )
  ) {

    return "ホラー淫夢";

  }


  /*
   * 該当なし
   */

  return "";

}


/* =========================================================
   タイトルが検索対象か
========================================================= */

function matchesHorrorTitle(
  title
) {

  return (
    getTitleTag(title) !== ""
  );

}


/* =========================================================
   ホラー淫夢シリーズ読み込み
========================================================= */

async function loadHorrorInmContent() {

  const container =
    document.getElementById(
      "list4"
    );


  const note =
    document.getElementById(
      "list4-note"
    );


  /*
   * videoIdをキーにする。
   *
   * 同じ動画が
   *
   * ・チャンネル取得
   * ・検索
   *
   * の両方から来ても1件だけ。
   */

  const combined =
    new Map();


  /* =====================================================
     ① 醜女ちゃんネル・おんちゃを取得
  ===================================================== */

  for (
    const channelName of KNOWN_CHANNELS
  ) {

    if (note) {

      note.textContent =
        `「${channelName}」を取得中...`;

    }


    const channelId =
      await resolveChannelIdByName(
        channelName
      );


    if (!channelId) {

      console.warn(
        `チャンネルを特定できませんでした: ${channelName}`
      );

      continue;

    }


    if (note) {

      note.textContent =
        `「${channelName}」の動画を取得中...`;

    }


    const uploads =
      await fetchChannelUploadsMap(
        channelId
      );


    /*
     * ★重要
     *
     * ここではタイトルによる除外をしない。
     *
     * 取得した動画は全部combinedへ入れる。
     *
     * 以前はここでFILTER_KEYWORDSに一致しない
     * 動画を捨てていた。
     */

    uploads.forEach(
      (info, videoId) => {

        if (
          !combined.has(
            videoId
          )
        ) {

          combined.set(
            videoId,
            {

              ...info,

              source:
                channelName,

              sourceType:
                "channel"

            }
          );

        }

      }
    );

  }


  /* =====================================================
     ② タイトルキーワード検索
  ===================================================== */

  for (
    const keyword of FILTER_KEYWORDS
  ) {

    if (note) {

      note.textContent =
        `「${keyword}」を検索中...`;

    }


    const candidateIds =
      await searchCandidates(
        keyword
      );


    if (note) {

      note.textContent =
        `「${keyword}」候補 ${candidateIds.size}件を確認中...`;

    }


    /*
     * IDから正式なタイトル・サムネイルを取得。
     */

    const detailsMap =
      await fetchVideoDetailsMap(
        [...candidateIds]
      );


    detailsMap.forEach(
      (info, videoId) => {

        /*
         * 検索語ではなく、
         * 必ずタイトルそのものから判定する。
         */

        const tag =
          getTitleTag(
            info.title
          );


        /*
         * タイトルに対象語がなければ除外。
         *
         * YouTube検索結果には、
         * 検索語と完全一致しないものが
         * 混ざることがあるため。
         */

        if (!tag) {

          return;

        }


        /*
         * 既にチャンネル取得済みなら
         * そちらを優先。
         */

        if (
          combined.has(
            videoId
          )
        ) {

          const existing =
            combined.get(
              videoId
            );


          /*
           * タグは後でタイトルから再取得。
           */

          existing.tag =
            tag;


          return;

        }


        /*
         * 新規追加。
         */

        combined.set(
          videoId,
          {

            ...info,

            source:
              info.channelTitle ||
              "検索",

            sourceType:
              "search",

            tag

          }
        );

      }
    );

  }


  /* =====================================================
     ③ 表示
  ===================================================== */

  /*
   * タイトルからタグを再計算。
   *
   * チャンネル取得動画についても
   * タイトルからタグを取得する。
   */

  const videos =
    [];


  combined.forEach(
    (info, videoId) => {

      const tag =
        getTitleTag(
          info.title
        );


      /*
       * タグがある場合
       */

      if (tag) {

        videos.push({

          videoId,

          ...info,

          tag

        });

        return;

      }


      /*
       * タグがない場合
       *
       * 醜女ちゃんネル・おんちゃから
       * 「取得できた動画」を捨てない。
       *
       * その代わり「タグなし」と表示する。
       */

      if (
        info.sourceType ===
        "channel"
      ) {

        videos.push({

          videoId,

          ...info,

          tag:
            "タグなし"

        });

      }

    }
  );


  /*
   * 表示順。
   *
   * 取得された順序を基本的に維持。
   */

  videos.forEach(
    video => {

      renderVideoData(

        video.videoId,

        video.title,

        video.thumb,

        container,

        video.tag,

        video.source

      );

    }
  );


  const count =
    videos.length;


  if (note) {

    if (
      count === 0
    ) {

      note.textContent =
        "動画を取得できませんでした";

    } else {

      note.textContent =
        `${count}件取得`;

    }

  }


  console.log(
    "ホラー淫夢シリーズ取得結果:",
    {

      total:
        count,

      sources:
        KNOWN_CHANNELS,

      keywords:
        FILTER_KEYWORDS

    }
  );

}


/* =========================================================
   動画表示
========================================================= */

function renderVideoData(

  videoId,

  title,

  thumb,

  container,

  tag,

  source

) {

  /*
   * 同じvideoIdが既に表示されていたら
   * 二重表示しない。
   */

  if (
    horrorVideoIds.has(
      videoId
    )
  ) {

    return;

  }


  horrorVideoIds.add(
    videoId
  );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "video";


  div.dataset.videoId =
    videoId;


  /* =====================================================
     サムネイル
  ===================================================== */

  const thumbWrap =
    document.createElement(
      "div"
    );


  thumbWrap.className =
    "thumb-wrap";


  const img =
    document.createElement(
      "img"
    );


  img.src =
    thumb;


  img.alt =
    title;


  img.loading =
    "lazy";


  /* =====================================================
     タイトル
  ===================================================== */

  const titleEl =
    document.createElement(
      "div"
    );


  titleEl.className =
    "title";


  titleEl.textContent =
    title;


  /* =====================================================
     タグ
  ===================================================== */

  const tagEl =
    document.createElement(
      "div"
    );


  tagEl.className =
    "tag";


  tagEl.textContent =
    `タグ：${tag}`;


  /* =====================================================
     取得元
  ===================================================== */

  const metaEl =
    document.createElement(
      "div"
    );


  metaEl.className =
    "meta";


  metaEl.textContent =
    `取得元：${source || "不明"}`;


  thumbWrap.appendChild(
    img
  );


  thumbWrap.appendChild(
    titleEl
  );


  thumbWrap.appendChild(
    tagEl
  );


  thumbWrap.appendChild(
    metaEl
  );


  thumbWrap.onclick =
    () =>
      play(
        videoId,
        div
      );


  /* =====================================================
     再生ボタン
  ===================================================== */

  const right =
    document.createElement(
      "div"
    );


  right.className =
    "right";


  const playBtn =
    document.createElement(
      "button"
    );


  playBtn.className =
    "play-btn";


  playBtn.textContent =
    "▶";


  playBtn.title =
    "再生";


  playBtn.onclick =
    () =>
      play(
        videoId,
        div
      );


  right.appendChild(
    playBtn
  );


  div.appendChild(
    thumbWrap
  );


  div.appendChild(
    right
  );


  container.appendChild(
    div
  );

}


/* =========================================================
   通常プレイリスト動画
========================================================= */

function renderVideo(
  item,
  container
) {

  const videoId =
    item.snippet
      ?.resourceId
      ?.videoId;


  if (!videoId) {

    return;

  }


  const title =
    item.snippet?.title ||
    "";


  const thumb =

    item.snippet?.thumbnails?.medium?.url ||

    item.snippet?.thumbnails?.high?.url ||

    item.snippet?.thumbnails?.default?.url ||

    "";


  renderVideoData(

    videoId,

    title,

    thumb,

    container,

    "",

    item.snippet?.channelTitle ||
      ""

  );

}


/* =========================================================
   開閉
========================================================= */

function toggle(
  id
) {

  const el =
    document.getElementById(
      id
    );


  if (!el) {

    return;

  }


  el.style.display =
    el.style.display ===
      "block"

      ? "none"

      : "block";

}


/* =========================================================
   動画再生
========================================================= */

function play(
  id,
  el
) {

  currentVideoId =
    id;


  document
    .querySelectorAll(
      ".video.playing"
    )
    .forEach(
      v =>
        v.classList.remove(
          "playing"
        )
    );


  if (el) {

    el.classList.add(
      "playing"
    );

  }


  if (
    player &&
    ytReady
  ) {

    try {

      player.loadVideoById(
        id
      );


      player.setPlaybackRate(
        selectedSpeed
      );


    } catch (e) {

      console.error(
        "動画再生エラー:",
        e
      );

    }


    if (isHidden) {

      try {

        player.playVideo();

      } catch (e) {}

    }

  }


  updatePlayerState();

}


/* =========================================================
   プレイヤー状態更新
========================================================= */

function updatePlayerState() {

  const area =
    document.getElementById(
      "player-area"
    );


  if (!currentVideoId) {

    area.classList.remove(
      "video-hidden"
    );


    stopProgressTracking();


    return;

  }


  if (isHidden) {

    area.classList.add(
      "video-hidden"
    );


    startProgressTracking();


  } else {

    area.classList.remove(
      "video-hidden"
    );


    stopProgressTracking();

  }

}


/* =========================================================
   サムネイル切り替え
========================================================= */

function toggleThumbs() {

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  const btn =
    document.getElementById(
      "thumbBtn"
    );


  const hidden =
    sidebar.classList.toggle(
      "thumbs-hidden"
    );


  btn.textContent =
    hidden

      ? "サムネイルを表示する"

      : "サムネイルを非表示にする";


  btn.classList.toggle(
    "active",
    hidden
  );

}


/* =========================================================
   動画非表示
========================================================= */

function toggleHide() {

  isHidden =
    !isHidden;


  const btn =
    document.getElementById(
      "hideBtn"
    );


  btn.textContent =
    isHidden

      ? "動画を表示する"

      : "動画を非表示にする";


  btn.classList.toggle(
    "active",
    isHidden
  );


  updatePlayerState();

}


/* =========================================================
   倍速メニュー
========================================================= */

function toggleSpeedMenu() {

  const menu =
    document.getElementById(
      "speed-menu"
    );


  menu.style.display =
    menu.style.display ===
      "block"

      ? "none"

      : "block";

}


/* =========================================================
   倍速設定
========================================================= */

function setSpeed(
  rate
) {

  selectedSpeed =
    rate;


  const menu =
    document.getElementById(
      "speed-menu"
    );


  menu
    .querySelectorAll(
      "button"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


  [
    ...menu.querySelectorAll(
      "button"
    )
  ]
    .find(
      btn =>
        btn.textContent ===
        `${rate}x`
    )
    ?.classList.add(
      "active"
    );


  if (
    player &&
    ytReady
  ) {

    try {

      player.setPlaybackRate(
        rate
      );

    } catch (e) {}

  }


  menu.style.display =
    "none";

}


/* =========================================================
   倍速メニュー外クリック
========================================================= */

document.addEventListener(
  "click",
  e => {

    const speedWrap =
      document.getElementById(
        "speed-wrap"
      );


    if (
      speedWrap &&
      !speedWrap.contains(
        e.target
      )
    ) {

      document.getElementById(
        "speed-menu"
      ).style.display =
        "none";

    }

  }
);


/* =========================================================
   時間表示
========================================================= */

function formatTime(
  sec
) {

  if (
    !isFinite(sec) ||
    sec < 0
  ) {

    sec =
      0;

  }


  const m =
    Math.floor(
      sec / 60
    );


  const s =
    Math.floor(
      sec % 60
    );


  return (

    `${m}:` +

    s
      .toString()
      .padStart(
        2,
        "0"
      )

  );

}


/* =========================================================
   進捗監視開始
========================================================= */

function startProgressTracking() {

  stopProgressTracking();


  progressTimer =
    setInterval(
      () => {

        if (
          !player ||
          !ytReady ||
          isSeeking
        ) {

          return;

        }


        try {

          const dur =
            player.getDuration();


          const cur =
            player.getCurrentTime();


          if (
            dur > 0
          ) {

            document.getElementById(
              "ccSeek"
            ).value =

              Math.floor(
                (
                  cur /
                  dur
                ) *
                1000
              );


            document.getElementById(
              "ccTime"
            ).textContent =

              `${formatTime(cur)} / ${formatTime(dur)}`;

          }


          const state =
            player.getPlayerState();


          document.getElementById(
            "ccPlayBtn"
          ).textContent =

            state ===
            YT.PlayerState.PLAYING

              ? "❚❚"

              : "▶";


        } catch (e) {}

      },

      400

    );

}


/* =========================================================
   進捗監視停止
========================================================= */

function stopProgressTracking() {

  if (
    progressTimer
  ) {

    clearInterval(
      progressTimer
    );


    progressTimer =
      null;

  }

}


/* =========================================================
   再生 / 一時停止
========================================================= */

function ccTogglePlay() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  const state =
    player.getPlayerState();


  if (
    state ===
    YT.PlayerState.PLAYING
  ) {

    player.pauseVideo();

  } else {

    player.playVideo();

  }

}


/* =========================================================
   シーク操作
========================================================= */

function ccOnSeekInput() {

  isSeeking =
    true;


  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  try {

    const dur =
      player.getDuration();


    const val =
      document.getElementById(
        "ccSeek"
      ).value;


    const target =
      (
        val /
        1000
      ) *
      dur;


    document.getElementById(
      "ccTime"
    ).textContent =

      `${formatTime(target)} / ${formatTime(dur)}`;


  } catch (e) {}

}


/* =========================================================
   シーク確定
========================================================= */

function ccOnSeekCommit() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  try {

    const dur =
      player.getDuration();


    const val =
      document.getElementById(
        "ccSeek"
      ).value;


    const target =
      (
        val /
        1000
      ) *
      dur;


    player.seekTo(
      target,
      true
    );


  } catch (e) {}


  isSeeking =
    false;

}


/* =========================================================
   音量
========================================================= */

function ccOnVolInput() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  const vol =
    document.getElementById(
      "ccVol"
    ).value;


  try {

    player.setVolume(
      vol
    );


    if (
      vol > 0 &&
      player.isMuted()
    ) {

      player.unMute();

    }


    document.getElementById(
      "ccVolIcon"
    ).textContent =

      vol == 0
        ? "🔇"
        : "🔊";


  } catch (e) {}

}


/* =========================================================
   ミュート
========================================================= */

function ccToggleMute() {

  if (
    !player ||
    !ytReady
  ) {

    return;

  }


  try {

    if (
      player.isMuted()
    ) {

      player.unMute();


      document.getElementById(
        "ccVolIcon"
      ).textContent =
        "🔊";


    } else {

      player.mute();


      document.getElementById(
        "ccVolIcon"
      ).textContent =
        "🔇";

    }


  } catch (e) {}

}

loadHorrorInmContent();
